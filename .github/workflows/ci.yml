name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install root and editor dependencies
        run: |
          npm ci
          npm --prefix editor ci

      - name: Run test suite
        run: npm test

      - name: Build game and editor
        run: npm run build:all
